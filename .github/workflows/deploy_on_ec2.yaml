name: Deploy on EC2
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (development, production)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  register-images:
    name: 'Register Images into ECR'
    uses: ./.github/workflows/build-and-push-images.yaml
    with:
      environment: ${{ github.event.inputs.environment }}

    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  deploy-on-ec2:
    name: 'Deploy on EC2 (${{ github.event.inputs.environment }})'
    needs: register-images
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Pull and Run Docker Container
        uses: appleboy/ssh-action@v1.2.2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAGE: ${{ needs.register-images.outputs.ecr_registry }}/${{ github.event.inputs.environment }}/sinamecc-backend:${{ needs.register-images.outputs.image_tag }}
          REGISTRY: ${{ needs.register-images.outputs.ecr_registry }}
          CONTAINER: sinamecc-backend-${{ github.event.inputs.environment }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH }}
          port: 22
          envs: DATABASE_URL,IMAGE,REGISTRY,CONTAINER
          script: |
          
            echo "> Logging into ECR"
            /home/ubuntu/.local/bin/aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin "$REGISTRY"

            echo "> Pulling image $IMAGE"
            docker pull "$IMAGE"

            echo "> Running migrations"
            docker run --rm -e DATABASE_URL="$DATABASE_URL" -e ENVIRONMENT=prod "$IMAGE" python manage.py migrate --noinput

            echo "> Replacing container $CONTAINER"
            docker rm -f "$CONTAINER" || true
            docker run -d --name "$CONTAINER" \
              --restart unless-stopped \
              -e DATABASE_URL="$DATABASE_URL" \
              -e ENVIRONMENT=prod \
              -p 8000:8000 \
              "$IMAGE"

            echo "> Pruning dangling images"
            docker image prune -f
